name: Windows file-session diagnostics only
on:
  push:
    branches:
      - codex/windows-recompute-diagnostics-20260922
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reproduce file-session errors under concurrent load
        run: node scripts/release-validation/stress-file-lifecycle.cjs
        env:
          MAT_DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/windows-lifecycle-diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-lifecycle-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/windows-lifecycle-diagnostic.json
          if-no-files-found: error
