name: Windows test only - 1.2.13

on:
  push:
    branches:
      - codex/windows-test-1.2.13-20260923
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    # The published NSIS 1.1.10 baseline crashes in System.dll on Server 2025.
    # Three identical installs pass on Server 2022; keep the upgrade baseline fixed.
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out selected validation ref
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Identify candidate
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          Write-Host "Windows candidate validation for v$packageVersion on ref $env:GITHUB_REF_NAME"

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        shell: pwsh
        run: |
          $output = npm test 2>&1
          $testExit = $LASTEXITCODE
          $output | Write-Output
          if ($testExit -ne 0) {
            ($output -join "`n") -split '(?m)(?=^test at )' | Select-Object -Skip 1 | ForEach-Object {
              $details = $_.Substring(0, [Math]::Min($_.Length, 3500))
              Write-Host ('::error::' + $details.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A'))
            }
            exit $testExit
          }

      - name: Check source
        run: npm run check

      - name: Build Windows package without publishing
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          npm run package:win -- "--config.win.artifactName=mat-roi-workbench-setup-$version.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Windows test build failed' }
        env:
          MAT_UPDATE_OWNER: ${{ github.repository_owner }}
          MAT_UPDATE_REPO: ${{ github.event.repository.name }}

      - name: Audit the exact packaged payload
        run: npm run audit:package -- --artifact dist-builder/win-unpacked

      - name: Probe packaged file-job child process
        run: npm run audit:package-child -- --artifact dist-builder/win-unpacked

      - name: Smoke test packaged Windows runtime
        shell: pwsh
        run: |
          $env:MAT_DATA_DIR = Join-Path $env:RUNNER_TEMP 'mat-workbench-candidate-data'
          $env:MAT_PORT = '4188'
          $executable = Join-Path $PWD 'dist-builder/win-unpacked/地垫工作台.exe'
          $process = Start-Process -FilePath $executable -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod 'http://127.0.0.1:4188/api/health' -TimeoutSec 2
                if ($health.version -eq (node -p "require('./package.json').version")) {
                  $ready = $true
                  break
                }
              } catch {}
            }
            if (-not $ready) { throw 'Packaged application health check did not become ready' }
          } finally {
            # Electron child processes otherwise survive a forced stop of only the main PID.
            taskkill /PID $process.Id /T /F 2>$null
            Get-Process | Where-Object { $_.Path -eq $executable } | Stop-Process -Force -ErrorAction SilentlyContinue
            $global:LASTEXITCODE = 0
          }

      - name: Select the exact installer prepared for delivery
        shell: pwsh
        run: |
          $expected = Get-Content validation/candidate/sha256.json -Raw | ConvertFrom-Json
          $installer = Join-Path $PWD ('validation/candidate/' + $expected.file)
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected.sha256) { throw 'Delivery installer SHA-256 mismatch' }
          if ((Get-Item $installer).Length -ne $expected.bytes) { throw 'Delivery installer size mismatch' }
          Copy-Item validation/candidate/*.exe, validation/candidate/*.blockmap, validation/candidate/latest.yml dist-builder -Force
          Write-Host ('::notice::Exact delivery installer: ' + ($expected | ConvertTo-Json -Compress))

      - name: Match release filenames and retrieve previous installer
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $exe = @(Get-ChildItem dist-builder -Filter *.exe)
          $map = @(Get-ChildItem dist-builder -Filter *.blockmap)
          if ($exe.Count -ne 1 -or $map.Count -ne 1) { throw 'Unexpected candidate files' }
          if ($exe[0].Name -ne "mat-roi-workbench-setup-$version.exe") { throw 'Installer filename mismatch' }
          if ($map[0].Name -ne "mat-roi-workbench-setup-$version.exe.blockmap") { throw 'Blockmap filename mismatch' }
          Invoke-WebRequest 'https://github.com/wuzt1991/mat-roi-workbench/releases/download/v1.1.10/mat-roi-workbench-setup-1.1.10.exe' -OutFile (Join-Path $env:RUNNER_TEMP 'old-installer.exe')
          $oldInstaller = Join-Path $env:RUNNER_TEMP 'old-installer.exe'
          if ((Get-FileHash $oldInstaller -Algorithm SHA256).Hash.ToLowerInvariant() -ne '42dd061a3edf6af011f957dbdd30f63a04417f8b49277617459c5548de137303') { throw 'Previous installer checksum mismatch' }
          $testInstall = Join-Path $env:RUNNER_TEMP 'mat-upgrade-validation/installed/mat-roi-workbench'
          New-Item -ItemType Directory -Force (Split-Path $testInstall) | Out-Null
          $oldProcess = Start-Process -FilePath $oldInstaller -ArgumentList @('/S', "/D=$testInstall") -Wait -PassThru
          if ($oldProcess.ExitCode -ne 0) { Write-Host "::error::Previous NSIS bootstrap exited $($oldProcess.ExitCode)"; throw 'Previous installation failed' }

      - name: Exercise old client download, restart installation and data migration
        env:
          CANDIDATE_RUN: ${{ github.run_id }}
          CANDIDATE_SHA: ${{ github.sha }}
        shell: pwsh
        run: |
          node scripts/release-validation/audit-windows-upgrade.cjs dist-builder (Join-Path $env:RUNNER_TEMP 'old-installer.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Windows upgrade validation failed' }

      - name: Audit installed payload and packaged G62 regression
        shell: pwsh
        run: |
          $installed = Get-Content (Join-Path $env:RUNNER_TEMP 'mat-upgrade-validation/installed-path.txt')
          $expected = Get-Content validation/candidate/sha256.json -Raw | ConvertFrom-Json
          if ((Get-FileHash (Join-Path $installed 'resources/app.asar') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected.payloadSha256) { throw 'Installed payload differs from final candidate' }
          node scripts/audit-release-package.cjs --artifact $installed
          if ($LASTEXITCODE -ne 0) { throw 'Installed payload audit failed' }
          node scripts/audit-packaged-child.cjs --artifact $installed
          if ($LASTEXITCODE -ne 0) { throw 'Installed child-process audit failed' }
          $env:MAT_VERIFY_ROOT = Join-Path $installed 'resources/app.asar'
          $env:MAT_VERIFY_OUTPUT = Join-Path $env:RUNNER_TEMP 'mat-upgrade-validation/fixtures'
          node scripts/release-validation/run-installed.cjs $installed fixtures
          if ($LASTEXITCODE -ne 0) { throw 'Installed G62 validation failed' }
          $env:MAT_VERIFY_OUTPUT = Join-Path $env:RUNNER_TEMP 'mat-upgrade-validation/locks'
          node scripts/release-validation/run-installed.cjs $installed locks
          if ($LASTEXITCODE -ne 0) { throw 'Installed lock regression failed' }

      - name: Verify scrolling in the actual installed Windows window
        shell: pwsh
        run: |
          $installed = Get-Content (Join-Path $env:RUNNER_TEMP 'mat-upgrade-validation/installed-path.txt')
          $tools = Join-Path $env:RUNNER_TEMP 'mat-browser-tools'
          npm install --prefix $tools --no-save --ignore-scripts playwright@1.56.1
          if ($LASTEXITCODE -ne 0) { throw 'Browser driver setup failed' }
          $env:MAT_PLAYWRIGHT_MODULE = Join-Path $tools 'node_modules/playwright'
          $env:MAT_SCROLL_INSTALLED = Join-Path $installed '地垫工作台.exe'
          $env:MAT_VERIFY_ROOT = Join-Path $installed 'resources/app.asar'
          $env:MAT_VERIFY_OUTPUT = Join-Path $env:RUNNER_TEMP 'mat-upgrade-validation/scroll'
          $env:MAT_VERIFY_LABEL = 'windows-installed'
          node scripts/release-validation/run-installed.cjs $installed scroll
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows scrolling validation failed' }

      - name: Verify rules, sales, ledger and backups in installed window
        shell: pwsh
        run: |
          $installed = Get-Content (Join-Path $env:RUNNER_TEMP 'mat-upgrade-validation/installed-path.txt')
          $env:MAT_STAGE3_INSTALLED = Join-Path $installed '地垫工作台.exe'
          $env:MAT_PLAYWRIGHT_MODULE = Join-Path $env:RUNNER_TEMP 'mat-browser-tools/node_modules/playwright'
          $env:MAT_VERIFY_OUTPUT = Join-Path $env:RUNNER_TEMP 'mat-upgrade-validation/business'
          node scripts/release-validation/run-installed.cjs $installed business
          if ($LASTEXITCODE -ne 0) { throw 'Installed business regression failed' }

      - name: Measure grouped product queries in installed runtime
        shell: pwsh
        run: |
          $installed = Get-Content (Join-Path $env:RUNNER_TEMP 'mat-upgrade-validation/installed-path.txt')
          $env:MAT_VERIFY_OUTPUT = Join-Path $env:RUNNER_TEMP 'mat-upgrade-validation/performance'
          node scripts/release-validation/run-installed.cjs $installed performance
          if ($LASTEXITCODE -ne 0) { throw 'Installed grouped performance verification failed' }

      - name: Validate 500000 row boundary using installed runtime
        shell: pwsh
        run: |
          $installed = Get-Content (Join-Path $env:RUNNER_TEMP 'mat-upgrade-validation/installed-path.txt')
          $env:MAT_VERIFY_ROOT = Join-Path $installed 'resources/app.asar'
          $env:MAT_VERIFY_OUTPUT = Join-Path $env:RUNNER_TEMP 'mat-upgrade-validation/large'
          foreach ($rows in @(500000, 500001)) {
            node scripts/release-validation/run-installed.cjs $installed large build $rows
            if ($LASTEXITCODE -ne 0) { throw 'Large fixture generation failed' }
            node scripts/release-validation/run-installed.cjs $installed large verify $rows
            if ($LASTEXITCODE -ne 0) { throw 'Large boundary verification failed' }
          }

      - name: Emit complete verifiable JSON evidence
        if: always()
        shell: pwsh
        run: python scripts/release-validation/emit-ci-evidence.py (Join-Path $env:RUNNER_TEMP 'mat-upgrade-validation') upgrade

      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-upgrade-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mat-upgrade-validation/report.json
            ${{ runner.temp }}/mat-upgrade-validation/fixtures/fixture-report.json
            ${{ runner.temp }}/mat-upgrade-validation/large/report-*.json
            ${{ runner.temp }}/mat-upgrade-validation/scroll/*
            ${{ runner.temp }}/mat-upgrade-validation/locks/lock-report.json
            ${{ runner.temp }}/mat-upgrade-validation/business/*
            ${{ runner.temp }}/mat-upgrade-validation/performance/*.json
            dist-builder/builder-effective-config.yaml
          if-no-files-found: warn

      - name: Summarize verified data boundaries
        shell: pwsh
        run: |
          @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'mat-upgrade-validation') -Recurse -Filter '*report*.json') + @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'mat-upgrade-validation/scroll') -Filter 'scroll-*.json') | ForEach-Object {
            $summary = (Get-Content $_.FullName -Raw | ConvertFrom-Json | ConvertTo-Json -Depth 12 -Compress)
            Write-Host ("::notice::" + $_.Name + ': ' + $summary.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A'))
          }

      - name: Keep audited files as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-candidate-${{ github.run_id }}
          path: |
            dist-builder/*.exe
            dist-builder/*.blockmap
            dist-builder/latest.yml
          if-no-files-found: error

  install-current-windows:
    needs: build-and-audit
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-candidate-${{ github.run_id }}
          path: candidate
      - name: Verify the same installer on current Windows
        shell: pwsh
        run: |
          trap { Write-Host ('::error::' + ($_ | Out-String) -replace '\r?\n',' / '); exit 1 }
          $metadata = Get-Content 'candidate/latest.yml' -Raw
          $version = [regex]::Match($metadata, '(?m)^version:\s*(.+)$').Groups[1].Value.Trim()
          $exe = (Resolve-Path "candidate/mat-roi-workbench-setup-$version.exe").Path
          $expectedHash = [regex]::Match($metadata, '(?m)^sha512:\s*(.+)$').Groups[1].Value.Trim()
          $actualHash = [Convert]::ToBase64String([System.Security.Cryptography.SHA512]::HashData([IO.File]::ReadAllBytes($exe)))
          if ($actualHash -ne $expectedHash) { throw 'Installer checksum mismatch' }
          $dest = Join-Path $env:RUNNER_TEMP 'current-windows/mat-roi-workbench'
          foreach ($attempt in 1..3) {
            $process = Start-Process -FilePath $exe -ArgumentList @('/S', "/D=$dest") -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Install attempt $attempt failed: $($process.ExitCode)" }
            Write-Host "::notice::Current Windows install attempt $attempt exit=0; version=$version; sha512=$actualHash"
          }
          $env:MAT_DATA_DIR = Join-Path $env:RUNNER_TEMP 'current-windows-data'
          $env:MAT_PORT = '4188'
          $app = Start-Process -FilePath (Join-Path $dest '地垫工作台.exe') -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod 'http://127.0.0.1:4188/api/health' -TimeoutSec 2
                if ($health.version -eq $version -and $health.dataDir -eq $env:MAT_DATA_DIR) { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) { throw 'Installed application did not become healthy' }
            Write-Host "::notice::Current Windows installed runtime healthy: v$version"
          } finally {
            taskkill /PID $app.Id /T /F 2>$null
            $global:LASTEXITCODE = 0
          }

  installed-lifecycle-stress:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install and stress the exact delivery package 100 times
        shell: pwsh
        run: |
          $expected = Get-Content validation/candidate/sha256.json -Raw | ConvertFrom-Json
          $installer = Join-Path $PWD ('validation/candidate/' + $expected.file)
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected.sha256) { throw 'Delivery installer SHA-256 mismatch' }
          $installed = Join-Path $env:RUNNER_TEMP 'mat-stress-installed'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installed") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Stress installation failed' }
          $expected = Get-Content validation/candidate/sha256.json -Raw | ConvertFrom-Json
          if ((Get-FileHash (Join-Path $installed 'resources/app.asar') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected.payloadSha256) { throw 'Installed payload differs from final candidate' }
          node scripts/audit-release-package.cjs --artifact $installed
          if ($LASTEXITCODE -ne 0) { throw 'Stress installed payload audit failed' }
          $env:MAT_VERIFY_OUTPUT = Join-Path $env:RUNNER_TEMP 'mat-stress-evidence'
          node scripts/release-validation/run-installed.cjs $installed locks
          if ($LASTEXITCODE -ne 0) { throw 'Stress installed lock regression failed' }
          node scripts/release-validation/run-installed.cjs $installed lifecycle
          if ($LASTEXITCODE -ne 0) { throw 'Installed lifecycle stress failed' }
      - name: Emit complete lifecycle evidence
        if: always()
        shell: pwsh
        run: python scripts/release-validation/emit-ci-evidence.py (Join-Path $env:RUNNER_TEMP 'mat-stress-evidence') lifecycle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-lifecycle-${{ github.run_id }}
          path: ${{ runner.temp }}/mat-stress-evidence/*.json
          if-no-files-found: error

  internal-upgrade-rollback:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Upgrade 1.2.10 to exact 1.2.13 and roll back with latest data
        shell: pwsh
        run: |
          $previous = Join-Path $env:RUNNER_TEMP 'previous-internal.exe'
          Invoke-WebRequest 'https://raw.githubusercontent.com/wuzt1991/mat-roi-workbench/6beda281f9f5e2f041c48cc3f76b39915fbc5065/validation/candidate/mat-roi-workbench-setup-1.2.10.exe' -OutFile $previous
          $tools = Join-Path $env:RUNNER_TEMP 'mat-browser-tools'
          npm install --prefix $tools --no-save --ignore-scripts playwright@1.56.1
          if ($LASTEXITCODE -ne 0) { throw 'Browser driver setup failed' }
          $env:MAT_PLAYWRIGHT_MODULE = Join-Path $tools 'node_modules/playwright'
          $env:MAT_VERIFY_OUTPUT = Join-Path $env:RUNNER_TEMP 'mat-internal-upgrade-evidence'
          node scripts/release-validation/verify-windows-rollback.cjs $previous validation/candidate/mat-roi-workbench-setup-1.2.13.exe
          if ($LASTEXITCODE -ne 0) { throw 'Internal upgrade or rollback failed' }
      - name: Emit complete internal upgrade evidence
        if: always()
        shell: pwsh
        run: python scripts/release-validation/emit-ci-evidence.py (Join-Path $env:RUNNER_TEMP 'mat-internal-upgrade-evidence') rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-internal-upgrade-${{ github.run_id }}
          path: ${{ runner.temp }}/mat-internal-upgrade-evidence/*
          if-no-files-found: error
